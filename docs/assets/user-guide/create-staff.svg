<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Create Staff</title><desc id="desc">Representative Create Staff form using fictional demo data with staff fields, jurisdiction, work schedule and entitlement review action.</desc><rect width="960" height="540" fill="#f6f8fa"/><text x="70" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1f1f1f">Create Staff</text><text x="70" y="88" font-family="Arial,sans-serif" font-size="14" fill="#666">Staff details</text><rect x="70" y="112" width="820" height="360" rx="12" fill="white" stroke="#dedede"/><text x="105" y="152" font-family="Arial,sans-serif" font-size="13">Staff ID</text><rect x="105" y="162" width="210" height="36" rx="5" fill="#fff" stroke="#bfbfbf"/><text x="120" y="185" font-family="Arial,sans-serif" font-size="14" fill="#555">DEMO-001</text><text x="350" y="152" font-family="Arial,sans-serif" font-size="13">Name</text><rect x="350" y="162" width="250" height="36" rx="5" fill="#fff" stroke="#bfbfbf"/><text x="365" y="185" font-family="Arial,sans-serif" font-size="14" fill="#555">Demo Employee</text><text x="105" y="230" font-family="Arial,sans-serif" font-size="13">Join date</text><rect x="105" y="240" width="210" height="36" rx="5" fill="#fff" stroke="#bfbfbf"/><text x="120" y="263" font-family="Arial,sans-serif" font-size="14" fill="#555">2026-09-01</text><text x="350" y="230" font-family="Arial,sans-serif" font-size="13">Jurisdiction</text><rect x="350" y="240" width="250" height="36" rx="5" fill="#fff" stroke="#bfbfbf"/><text x="365" y="263" font-family="Arial,sans-serif" font-size="14" fill="#555">Singapore</text><rect x="640" y="152" width="205" height="165" rx="8" fill="#fafafa" stroke="#e2e2e2"/><text x="658" y="180" font-family="Arial,sans-serif" font-size="14" font-weight="700">Work schedule</text><text x="658" y="207" font-family="Arial,sans-serif" font-size="12">Monday–Friday: Full day</text><text x="658" y="231" font-family="Arial,sans-serif" font-size="12">Saturday: Not working</text><text x="658" y="255" font-family="Arial,sans-serif" font-size="12">Sunday: Not working</text><text x="658" y="291" font-family="Arial,sans-serif" font-size="12" fill="#666">Used for leave-day calculation</text><rect x="105" y="320" width="495" height="85" rx="8" fill="#f6ffed" stroke="#b7eb8f"/><text x="123" y="348" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#389e0d">Leave entitlements</text><text x="123" y="374" font-family="Arial,sans-serif" font-size="12" fill="#333">Eligible jurisdiction policies are proposed after staff details are reviewed.</text><rect x="105" y="420" width="205" height="38" rx="6" fill="#1677ff"/><text x="207" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white">Next: Review Entitlements</text><rect x="325" y="420" width="90" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="370" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Cancel</text></svg>