<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Apply for leave</title><desc id="desc">Representative Apply for leave form with fictional annual leave request data.</desc><rect width="960" height="540" fill="#f6f8fa"/><text x="80" y="64" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1f1f1f">Apply for leave</text><text x="80" y="91" font-family="Arial,sans-serif" font-size="14" fill="#666">Submit a leave request for one or more working days.</text><rect x="80" y="118" width="800" height="360" rx="12" fill="white" stroke="#dedede"/><text x="120" y="158" font-family="Arial,sans-serif" font-size="13" fill="#333">Leave type</text><rect x="120" y="170" width="330" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="136" y="195" font-family="Arial,sans-serif" font-size="14" fill="#555">Annual Leave</text><text x="120" y="239" font-family="Arial,sans-serif" font-size="13" fill="#333">From date</text><rect x="120" y="250" width="220" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="136" y="275" font-family="Arial,sans-serif" font-size="14" fill="#555">2026-09-14</text><text x="390" y="239" font-family="Arial,sans-serif" font-size="13" fill="#333">To date</text><rect x="390" y="250" width="220" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="406" y="275" font-family="Arial,sans-serif" font-size="14" fill="#555">2026-09-15</text><text x="120" y="319" font-family="Arial,sans-serif" font-size="13" fill="#333">Duration</text><rect x="120" y="330" width="220" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="136" y="355" font-family="Arial,sans-serif" font-size="14" fill="#555">Full day</text><text x="390" y="319" font-family="Arial,sans-serif" font-size="13" fill="#333">Attachment</text><rect x="390" y="330" width="170" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="475" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Choose file</text><rect x="120" y="398" width="145" height="40" rx="6" fill="#1677ff"/><text x="192" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white">Submit request</text><rect x="282" y="398" width="90" height="40" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="327" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Cancel</text><rect x="632" y="168" width="210" height="170" rx="8" fill="#e6f4ff" stroke="#91caff"/><text x="650" y="196" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#0958d9">Date rules</text><text x="650" y="224" font-family="Arial,sans-serif" font-size="12" fill="#333">• Not before join date</text><text x="650" y="248" font-family="Arial,sans-serif" font-size="12" fill="#333">• Not after termination date</text><text x="650" y="272" font-family="Arial,sans-serif" font-size="12" fill="#333">• End date ≥ start date</text><text x="650" y="296" font-family="Arial,sans-serif" font-size="12" fill="#333">• Holidays/non-work days excluded</text></svg>