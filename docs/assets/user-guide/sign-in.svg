<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">LeaveMaestro sign-in</title><desc id="desc">Representative LeaveMaestro login screen with Tenant ID, Login name, Continue, Google and GitHub sign-in options using fictional data.</desc><rect width="960" height="540" fill="#f6f8fa"/><rect x="270" y="42" width="420" height="456" rx="14" fill="white" stroke="#d9d9d9"/><text x="305" y="88" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1f1f1f">LeaveMaestro</text><text x="305" y="116" font-family="Arial,sans-serif" font-size="14" fill="#666">Sign in with Google, GitHub, or your LeaveMaestro account.</text><text x="305" y="157" font-family="Arial,sans-serif" font-size="14" fill="#333">Tenant ID</text><rect x="305" y="168" width="350" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="318" y="193" font-family="Arial,sans-serif" font-size="14" fill="#555">DEMO</text><text x="305" y="234" font-family="Arial,sans-serif" font-size="14" fill="#333">Login name</text><rect x="305" y="245" width="350" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="318" y="270" font-family="Arial,sans-serif" font-size="14" fill="#555">staff001</text><rect x="305" y="304" width="350" height="40" rx="6" fill="#1677ff"/><text x="480" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="white">Continue</text><text x="480" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#888">or continue with</text><rect x="305" y="390" width="350" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="480" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Continue with Google</text><rect x="305" y="440" width="350" height="38" rx="6" fill="#fff" stroke="#bfbfbf"/><text x="480" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Continue with GitHub</text></svg>