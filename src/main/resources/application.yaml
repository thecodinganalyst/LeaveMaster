spring:
  application:
    name: spring-template
  datasource:
    url: jdbc:h2:mem:leavemaster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/{vendor}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:replace-me}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-me}
            scope:
              - read:user
              - user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:replace-me}
            client-secret: ${FACEBOOK_CLIENT_SECRET:replace-me}
            scope:
              - public_profile
              - email
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID:replace-me}
            client-secret: ${MICROSOFT_CLIENT_SECRET:replace-me}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            jwk-set-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
            user-name-attribute: sub

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs