plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.practical.leavemaster'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
	}
}

dependencies {
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	implementation 'com.google.cloud:google-cloud-storage:2.49.0'
	
	compileOnly 'org.projectlombok:lombok'
	
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql:42.7.12'
	
	annotationProcessor 'org.projectlombok:lombok'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

tasks.register('smokeTest', Test) {
	description = 'Runs the compact backend business smoke scenarios used by PR CI.'
	group = 'verification'
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.standardScenarioContainsTenantStaffAndAnnualEntitlements'
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.midYearJoinerStartsEntitlementOnJoinDateAndReceivesProratedAmount'
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.cannotApplyBeforeEmploymentStartDate'
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.assignedManagerCanApproveAndUnrelatedManagerCannotAct'
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.tenantBoundaryRejectsLeaveTypeFromAnotherTenant'
	}
	shouldRunAfter test
}

tasks.register('regressionTest', Test) {
	description = 'Runs the complete backend core business regression catalogue.'
	group = 'verification'
	useJUnitPlatform()
	filter {
		includeTestsMatching 'com.practical.leavemaster.leaveapplication.CoreBusinessScenarioRegressionTest.*'
	}
	shouldRunAfter test
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.90
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification
