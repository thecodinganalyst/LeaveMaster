server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: __session
        http-only: true
        secure: true
        same-site: none

spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

app:
  public-url: ${APP_PUBLIC_URL}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  storage:
    gcs-bucket: ${GCS_ATTACHMENT_BUCKET}
