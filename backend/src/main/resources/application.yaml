spring:
  application:
    name: spring-template
  datasource:
    url: jdbc:h2:mem:leavemaster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/{vendor}
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:replace-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:replace-me}
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID:replace-me}
            client-secret: ${GITHUB_CLIENT_SECRET:replace-me}
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:replace-me}
            client-secret: ${FACEBOOK_CLIENT_SECRET:replace-me}
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - public_profile
              - email
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID:replace-me}
            client-secret: ${MICROSOFT_CLIENT_SECRET:replace-me}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            jwk-set-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:common}/discovery/v2.0/keys
            user-name-attribute: sub
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    retry:
      max-attempts: ${ASSISTANT_PROVIDER_RETRY_MAX_ATTEMPTS:3}
      backoff:
        initial-interval: ${ASSISTANT_PROVIDER_RETRY_INITIAL_INTERVAL:1s}
        multiplier: 2
        max-interval: ${ASSISTANT_PROVIDER_RETRY_MAX_INTERVAL:5s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${ASSISTANT_MODEL:${OPENAI_MODEL:gpt-5-mini}}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${ASSISTANT_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
    tools:
      throw-exception-on-error: true
    mcp:
      server:
        name: LeaveMaestro MCP Server
        version: 1.0.0
        description: MCP server providing access to all LeaveMaestro APIs
        type: SYNC
        protocol: STREAMABLE

platform:
  admin:
    password: ${PLATFORM_ADMIN_PASSWORD:changeme}
    reset-password: ${PLATFORM_ADMIN_RESET_PASSWORD:false}

tenant:
  admin:
    default:
      password: ${TENANT_ADMIN_DEFAULT_PASSWORD:changeme}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:${java.io.tmpdir}/leavemaster-attachments}
  customer-enquiry:
    notification-recipient: ${CUSTOMER_ENQUIRY_NOTIFICATION_RECIPIENT:}
    notification-from: ${CUSTOMER_ENQUIRY_NOTIFICATION_FROM:noreply@leavemaestro.com}
    max-request-bytes: ${CUSTOMER_ENQUIRY_MAX_REQUEST_BYTES:16384}
    rate-limit:
      max-requests: ${CUSTOMER_ENQUIRY_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${CUSTOMER_ENQUIRY_RATE_LIMIT_WINDOW_SECONDS:900}
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
    provider: ${ASSISTANT_PROVIDER:openai}
    model: ${ASSISTANT_MODEL:}
    timeout-seconds: ${ASSISTANT_TIMEOUT_SECONDS:30}
    confirmation-ttl-seconds: ${ASSISTANT_CONFIRMATION_TTL_SECONDS:300}
    max-message-chars: ${ASSISTANT_MAX_MESSAGE_CHARS:4000}
    rate-limit:
      user-per-minute: ${ASSISTANT_USER_REQUESTS_PER_MINUTE:20}
      tenant-per-minute: ${ASSISTANT_TENANT_REQUESTS_PER_MINUTE:100}
    circuit-breaker:
      failure-threshold: ${ASSISTANT_CIRCUIT_FAILURE_THRESHOLD:5}
      open-seconds: ${ASSISTANT_CIRCUIT_OPEN_SECONDS:30}
