name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/terraform/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

concurrency:
  group: leavemaster-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_service_name: leavemaster-api
  TF_VAR_artifact_repository: leavemaster
  TF_VAR_database_host: ${{ vars.SUPABASE_DB_HOST }}
  TF_VAR_database_username: ${{ vars.SUPABASE_DB_USERNAME }}
  TF_VAR_database_name: postgres
  TF_VAR_image_tag: ${{ github.sha }}
  TF_VAR_github_actions_service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
  TF_VAR_allowed_frontend_origins: ${{ vars.ALLOWED_FRONTEND_ORIGINS || '[]' }}
  TF_VAR_enable_ai_assistant: ${{ vars.ENABLE_AI_ASSISTANT || 'false' }}
  TF_VAR_ai_assistant_provider: ${{ vars.AI_ASSISTANT_PROVIDER || 'openai' }}
  TF_VAR_ai_assistant_model: ${{ vars.AI_ASSISTANT_MODEL || 'gpt-5-mini' }}
  TF_VAR_openai_api_key_secret_id: ${{ vars.OPENAI_API_KEY_SECRET_ID || 'leavemaster-openai-api-key' }}
  TF_VAR_gemini_api_key_secret_id: ${{ vars.GEMINI_API_KEY_SECRET_ID || 'leavemaster-gemini-api-key' }}
  TF_VAR_enable_platform_admin_password_secret: ${{ vars.ENABLE_PLATFORM_ADMIN_PASSWORD_SECRET || 'false' }}
  TF_VAR_reset_platform_admin_password: ${{ vars.RESET_PLATFORM_ADMIN_PASSWORD || 'false' }}
  TF_VAR_enable_firebase_hosting: ${{ vars.ENABLE_FIREBASE_HOSTING || 'false' }}
  TF_VAR_frontend_environment: ${{ vars.FRONTEND_ENVIRONMENT || 'production' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure optional custom frontend URL
        env:
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
        run: |
          if [[ -n "${PUBLIC_APP_URL}" ]]; then
            echo "TF_VAR_public_app_url=${PUBLIC_APP_URL}" >> "${GITHUB_ENV}"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=leavemaster/production"

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Provision build and hosting prerequisites
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -target=google_project_service.required \
            -target=google_storage_bucket.cloudbuild_source \
            -target=google_storage_bucket.attachments \
            -target=google_artifact_registry_repository.docker \
            -target=google_service_account.cloud_run \
            -target=google_secret_manager_secret.database_password \
            -target=google_secret_manager_secret_iam_member.cloud_run_database_password \
            -target=google_secret_manager_secret.platform_admin_password \
            -target=google_secret_manager_secret_iam_member.cloud_run_platform_admin_password \
            -target=google_secret_manager_secret_iam_member.cloud_run_openai_api_key \
            -target=google_secret_manager_secret_iam_member.cloud_run_gemini_api_key \
            -target=google_storage_bucket_iam_member.cloud_run_attachments \
            -target=google_storage_bucket_iam_member.github_cloudbuild_source \
            -target=google_project_service.firebase \
            -target=google_firebase_project.frontend \
            -target=google_firebase_hosting_site.frontend

      - name: Build backend artifact
        run: chmod +x ./backend/gradlew && ./backend/gradlew bootJar

      - name: Build and push container image
        run: |
          SOURCE_BUCKET="$(terraform \
            -chdir=infra/terraform \
            output -raw cloudbuild_source_bucket)"

          # Do not read container_image from Terraform state here. The preceding
          # targeted apply may leave state-backed outputs stale, while the full
          # plan below evaluates TF_VAR_image_tag from the current GitHub SHA.
          CONTAINER_IMAGE="${TF_VAR_region}-docker.pkg.dev/${TF_VAR_project_id}/${TF_VAR_artifact_repository}/${TF_VAR_service_name}:${TF_VAR_image_tag}"

          echo "Building ${CONTAINER_IMAGE}"

          gcloud builds submit \
            --project="${TF_VAR_project_id}" \
            --gcs-source-staging-dir="gs://${SOURCE_BUCKET}/source" \
            --default-buckets-behavior=regional-user-owned-bucket \
            --tag="${CONTAINER_IMAGE}" \
            .

      - name: Terraform plan
        working-directory: infra/terraform
        run: |
          terraform plan \
            -var="deploy_service=true" \
            -out=tfplan

      - name: Protect existing backend infrastructure
        working-directory: infra/terraform
        run: |
          chmod +x ./check-protected-plan.sh
          ./check-protected-plan.sh tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Show service URL
        working-directory: infra/terraform
        run: terraform output -raw cloud_run_url
