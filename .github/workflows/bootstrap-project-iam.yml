name: Bootstrap deployment project IAM

on:
  workflow_dispatch:

concurrency:
  group: leavemaster-production-iam-bootstrap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_image_tag: bootstrap
  TF_VAR_database_host: ${{ vars.SUPABASE_DB_HOST }}
  TF_VAR_database_username: ${{ vars.SUPABASE_DB_USERNAME }}
  TF_VAR_github_actions_service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
  TF_VAR_github_oauth_client_id: ${{ vars.GH_CLIENT_ID }}
  TF_VAR_google_oauth_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
  TF_VAR_manage_deployment_project_iam: "true"
  TF_VAR_enable_production_monitoring: ${{ vars.ENABLE_PRODUCTION_MONITORING || 'true' }}
  TF_VAR_manage_production_monitoring: "true"

jobs:
  bootstrap:
    name: Bootstrap deployment monitoring
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require distinct bootstrap identity
        shell: bash
        env:
          BOOTSTRAP_WIF_SERVICE_ACCOUNT: ${{ vars.BOOTSTRAP_WIF_SERVICE_ACCOUNT }}
          DEPLOY_WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "${BOOTSTRAP_WIF_SERVICE_ACCOUNT}" ]; then
            echo "::error::BOOTSTRAP_WIF_SERVICE_ACCOUNT must be configured in the production environment."
            exit 1
          fi
          if [ "${BOOTSTRAP_WIF_SERVICE_ACCOUNT}" = "${DEPLOY_WIF_SERVICE_ACCOUNT}" ]; then
            echo "::error::Bootstrap and routine deployment service accounts must be different."
            exit 1
          fi

      - name: Authenticate to Google Cloud as bootstrap identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.BOOTSTRAP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=leavemaster/production"

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Plan deployment project IAM bootstrap
        working-directory: infra/terraform
        run: |
          terraform plan \
            -target=google_project_iam_member.github_actions_monitoring \
            -out=iam-bootstrap.tfplan

      - name: Apply deployment project IAM bootstrap
        working-directory: infra/terraform
        run: terraform apply -auto-approve iam-bootstrap.tfplan

      - name: Configure optional monitoring notification email
        if: ${{ vars.MONITORING_NOTIFICATION_EMAIL != '' }}
        shell: bash
        env:
          MONITORING_NOTIFICATION_EMAIL: ${{ vars.MONITORING_NOTIFICATION_EMAIL }}
        run: echo "TF_VAR_monitoring_notification_email=${MONITORING_NOTIFICATION_EMAIL}" >> "$GITHUB_ENV"

      - name: Plan production monitoring
        working-directory: infra/terraform
        run: |
          terraform plan \
            -target=google_logging_metric.application_errors \
            -target=google_monitoring_notification_channel.email \
            -target=google_monitoring_alert_policy.cloud_run_5xx \
            -target=google_monitoring_alert_policy.application_errors \
            -out=monitoring-bootstrap.tfplan

      - name: Apply production monitoring
        working-directory: infra/terraform
        run: terraform apply -auto-approve monitoring-bootstrap.tfplan
