name: Frontend CI and Firebase Hosting

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  workflow_dispatch:

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Enforce coverage gate
        run: npm run coverage

      - name: Production build
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production to Firebase Hosting
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: leavemaster-frontend-production
      cancel-in-progress: false
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      FRONTEND_ENVIRONMENT: ${{ vars.FRONTEND_ENVIRONMENT || 'production' }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Download production build
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.24.0

      - name: Configure production Hosting site
        working-directory: frontend
        run: |
          SITE_ID="${FIREBASE_HOSTING_SITE:-${GCP_PROJECT_ID}-${FRONTEND_ENVIRONMENT}}"
          echo "Deploying to Firebase Hosting site ${SITE_ID}"
          jq --arg site "${SITE_ID}" '.hosting.site = $site' firebase.json > firebase.ci.json

      - name: Deploy Firebase Hosting
        working-directory: frontend
        run: |
          firebase deploy \
            --only hosting \
            --project="${GCP_PROJECT_ID}" \
            --config=firebase.ci.json \
            --non-interactive \
            --message="GitHub ${GITHUB_SHA}"
