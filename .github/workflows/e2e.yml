name: End-to-end PR smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright PR smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests and coverage verification
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Run backend business smoke scenarios
        working-directory: backend
        run: ./gradlew smokeTest

      - name: Start isolated E2E backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=e2e' > ../e2e-backend.log 2>&1 &
          echo $! > ../e2e-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api-docs > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../e2e-backend.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and coverage gate
        working-directory: frontend
        run: |
          npm test
          npm run coverage

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright PR smoke tests
        working-directory: frontend/e2e
        env:
          E2E_BACKEND_URL: http://127.0.0.1:8080
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: frontend/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-test-reports
          path: backend/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-test-results
          path: frontend/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-backend-log
          path: e2e-backend.log
          if-no-files-found: warn
          retention-days: 14
