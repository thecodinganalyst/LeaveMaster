name: End-to-end tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests and coverage verification
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and coverage gate
        working-directory: frontend
        run: |
          npm test
          npm run coverage

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend/e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14
