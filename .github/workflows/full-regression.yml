name: Full business regression

on:
  schedule:
    # 02:00 Singapore time every day (18:00 UTC on the previous day).
    - cron: '0 18 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/full-regression.yml'
      - '.github/workflows/e2e.yml'
      - 'scripts/testing/**'
      - 'docs/testing/scenario-catalogue.json'
      - 'frontend/e2e/package.json'
      - 'frontend/e2e/playwright.config.ts'
      - 'frontend/e2e/tests/**'
      - 'backend/build.gradle'
      - 'backend/src/test/java/com/practical/leavemaster/leaveapplication/CoreBusinessScenarioRegressionTest.java'

concurrency:
  group: full-business-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full business regression
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run backend tests and coverage verification
        working-directory: backend
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Run backend business regression catalogue
        working-directory: backend
        run: ./gradlew regressionTest

      - name: Start isolated E2E backend
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=e2e' > ../full-regression-backend.log 2>&1 &
          echo $! > ../full-regression-backend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api-docs > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../full-regression-backend.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests and coverage gate
        working-directory: frontend
        run: |
          npm test
          npm run coverage

      - name: Install E2E dependencies
        working-directory: frontend/e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run full Playwright regression suite
        working-directory: frontend/e2e
        env:
          E2E_BACKEND_URL: http://127.0.0.1:8080
        run: npm run test:regression

      - name: Generate business scenario regression report
        if: always()
        run: |
          node scripts/testing/generate-scenario-report.mjs \
            --suite regression \
            --backend-results backend/build/test-results/regressionTest \
            --playwright-results frontend/e2e/test-results/playwright-results.json \
            --output build/scenario-report-regression
          cat build/scenario-report-regression/scenario-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload business scenario regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-coverage-full-regression
          path: build/scenario-report-regression/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-regression-report
          path: frontend/e2e/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-regression-reports
          path: backend/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-regression-results
          path: frontend/e2e/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-backend-log
          path: full-regression-backend.log
          if-no-files-found: warn
          retention-days: 14
