name: AskLeaveMaestro live Gemini evaluation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/assistant-live-eval/**'
      - '.github/workflows/assistant-live-evaluation.yml'
      - 'docs/development/askleavemaestro-evaluation.md'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Dedicated evaluation API base URL (blank uses repository variable)'
        required: false
        type: string
      full_suite:
        description: 'Reserved for expanded live scenario catalogues'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: askleavemaestro-live-evaluation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate evaluator syntax and scenario catalogue
        run: |
          node --test scripts/assistant-live-eval/*.test.mjs
          node --check scripts/assistant-live-eval/run.mjs
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('scripts/assistant-live-eval/scenarios.json')); if (!Array.isArray(s) || !s.length) throw new Error('scenario catalogue is empty'); if (!s.some(x=>x.critical)) throw new Error('critical scenarios required'); if (!s.some(x=>x.category==='tenant-isolation')) throw new Error('tenant-isolation scenario required');"

  live-evaluation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      LIVE_EVAL_BASE_URL: ${{ inputs.base_url || vars.ASSISTANT_LIVE_EVAL_BASE_URL }}
      LIVE_EVAL_TENANT_ID: ${{ vars.ASSISTANT_LIVE_EVAL_TENANT_ID || 'EVALUATION' }}
      LIVE_EVAL_MAX_ATTEMPTS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate evaluation target and cloud identity configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo 'GCP_PROJECT_ID is required'; exit 1; }
          test -n "$WIF_PROVIDER" || { echo 'WIF_PROVIDER is required'; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo 'WIF_SERVICE_ACCOUNT is required'; exit 1; }
          test -n "$LIVE_EVAL_BASE_URL" || { echo 'ASSISTANT_LIVE_EVAL_BASE_URL is required'; exit 1; }
          [[ "$LIVE_EVAL_BASE_URL" == https://* ]] || { echo 'Evaluation URL must be HTTPS'; exit 1; }
          [[ "$LIVE_EVAL_TENANT_ID" != DEMO && "$LIVE_EVAL_TENANT_ID" != PLATFORM ]] || { echo 'Evaluation tenant must be isolated'; exit 1; }
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
      - name: Retrieve evaluation credentials from Secret Manager
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PASSWORD_SECRET_ID: ${{ vars.ASSISTANT_LIVE_EVAL_PASSWORD_SECRET_ID || 'leavemaestro-evaluation-password' }}
          RESET_SECRET_ID: ${{ vars.ASSISTANT_LIVE_EVAL_RESET_TOKEN_SECRET_ID || 'leavemaestro-evaluation-reset-token' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID"
          umask 077
          gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$PASSWORD_SECRET_ID" > "$RUNNER_TEMP/evaluation-password"
          gcloud secrets versions access latest --project="$PROJECT_ID" --secret="$RESET_SECRET_ID" > "$RUNNER_TEMP/evaluation-reset-token"
          test -s "$RUNNER_TEMP/evaluation-password"
          test -s "$RUNNER_TEMP/evaluation-reset-token"
      - name: Diagnose evaluation reset endpoint security
        shell: bash
        run: |
          set -euo pipefail
          # Missing token MUST be rejected by the controller with 403.
          # A 401 means the request was rejected before controller token validation.
          probe_url="${LIVE_EVAL_BASE_URL%/}/api/internal/evaluation/reset"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/evaluation-reset-probe" --write-out '%{http_code}' --max-time 60 --request POST "$probe_url")"
          echo "Evaluation reset missing-token status: $status"
          if [ "$status" = "401" ]; then
            echo "::error::Reset endpoint returned 401 before token validation. Check Cloud Run public invoker IAM, active revision, and Spring Security routing. Expected 403."
            exit 1
          fi
          if [ "$status" != "403" ]; then
            echo "::error::Reset endpoint missing-token check returned HTTP $status (expected 403). Do not run destructive reset."
            exit 1
          fi
      - name: Diagnose token-header routing without resetting data
        shell: bash
        run: |
          set -euo pipefail
          probe_url="${LIVE_EVAL_BASE_URL%/}/api/internal/evaluation/reset"
          # Deliberately invalid token: controller must return 403, never reset data.
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/evaluation-invalid-token-probe" --write-out '%{http_code}' --max-time 60 --request POST --header 'X-Evaluation-Reset-Token: deliberately-invalid-evaluation-probe' "$probe_url")"
          echo "Evaluation reset invalid-token status: $status"
          if [ "$status" != "403" ]; then
            echo "::error::A reset request with an invalid token returned HTTP $status instead of 403. Investigate header-sensitive upstream/security handling."
            exit 1
          fi
          node --input-type=module -e '
            const url = process.env.LIVE_EVAL_BASE_URL.replace(/\/$/, "") + "/api/internal/evaluation/reset";
            const response = await fetch(url, { method: "POST", headers: { "X-Evaluation-Reset-Token": "deliberately-invalid-evaluation-probe" }, redirect: "manual" });
            console.log("Node fetch invalid-token status:", response.status);
            if (response.status !== 403) process.exitCode = 1;
          '
      - name: Run live configured-model evaluation
        shell: bash
        run: |
          set -euo pipefail
          export LIVE_EVAL_PASSWORD="$(cat "$RUNNER_TEMP/evaluation-password")"
          export LIVE_EVAL_RESET_TOKEN="$(cat "$RUNNER_TEMP/evaluation-reset-token")"
          rm -f "$RUNNER_TEMP/evaluation-password" "$RUNNER_TEMP/evaluation-reset-token"
          node scripts/assistant-live-eval/run.mjs
      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f build/reports/assistant-live-evaluation/live-evaluation.md ]; then
            cat build/reports/assistant-live-evaluation/live-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askleavemaestro-live-evaluation-${{ github.run_id }}
          retention-days: 30
          path: build/reports/assistant-live-evaluation/
