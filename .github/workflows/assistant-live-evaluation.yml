name: AskLeaveMaestro live Gemini evaluation

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'scripts/assistant-live-eval/**'
      - '.github/workflows/assistant-live-evaluation.yml'
      - 'docs/development/askleavemaestro-evaluation.md'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed LeaveMaestro API base URL (blank uses repository variable/default)'
        required: false
        type: string
      full_suite:
        description: 'Reserved for expanded live scenario catalogues'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: read

concurrency:
  group: askleavemaestro-live-evaluation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate evaluator syntax and scenario catalogue
        run: |
          node --check scripts/assistant-live-eval/run.mjs
          node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('scripts/assistant-live-eval/scenarios.json')); if (!Array.isArray(s) || !s.length) throw new Error('scenario catalogue is empty'); if (!s.some(x=>x.critical)) throw new Error('critical scenarios required'); if (!s.some(x=>x.category==='tenant-isolation')) throw new Error('tenant-isolation scenario required');"

  live-evaluation:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_EVAL_BASE_URL: ${{ inputs.base_url || vars.ASSISTANT_LIVE_EVAL_BASE_URL || 'https://leavemaster-api-63vdkoko4a-as.a.run.app' }}
      LIVE_EVAL_MAX_ATTEMPTS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run live configured-model evaluation
        run: node scripts/assistant-live-eval/run.mjs
      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f build/reports/assistant-live-evaluation/live-evaluation.md ]; then
            cat build/reports/assistant-live-evaluation/live-evaluation.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload live evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: askleavemaestro-live-evaluation-${{ github.run_id }}
          retention-days: 30
          path: build/reports/assistant-live-evaluation/
